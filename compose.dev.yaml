# dev: http://127.0.0.1:8081, data in ./data/dev, every crawl is a dry run, ./app reloads on save.
# Control with ./server.sh dev ...
name: torrent_web_scraper-dev
services:
  scraper:
    build: .
    image: torrent-web-scraper:dev
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data/dev:/data
      - ./app:/app/app
    env_file: .env
    environment:
      APP_ENV: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload", "--reload-dir", "app"]
    init: true
    shm_size: 1gb
